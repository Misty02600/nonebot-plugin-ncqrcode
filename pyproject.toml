[project]
name = "nonebot-plugin-ncqrcode"
version = "0.2.0"
description = "监控 NapCat 登录状态并推送登录二维码"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Misty02600", email = "Misty02600@users.noreply.github.com" }]
dependencies = [
  "httpx>=0.28.1,<1.0.0",
  "nonebot2>=2.4.4,<3.0.0",
  "nonebot-plugin-alconna>=0.60.4,<1.0.0",
  "nonebot-plugin-localstore>=0.7.4,<1.0.0",
  "nonebot-plugin-uninfo>=0.10.1,<1.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "qrcode[pil]>=8.2,<9.0",
]

[project.urls]
Homepage = "https://github.com/Misty02600/nonebot-plugin-ncqrcode"
Issues = "https://github.com/Misty02600/nonebot-plugin-ncqrcode/issues"
Repository = "https://github.com/Misty02600/nonebot-plugin-ncqrcode.git"

[dependency-groups]
dev = [
  "commitizen>=4.1.0,<5.0.0",
  "git-cliff>=2.11.0,<3.0.0",
  "nb-cli>=1.7.0,<2.0.0",
  "prek>=0.2.0,<1.0.0",
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "type" },
]
lint = [
  "ruff>=0.14.13,<1.0.0",
]
test = [
  "pytest>=9.0.0,<10.0.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot2[fastapi]>=2.4.4,<3.0.0",
  "nonebug>=0.4.3,<1.0.0",
  "pytest-asyncio>=1.3.0,<1.4.0",
]
type = [
  "basedpyright>=1.16.0,<2.0.0",
]

[tool.nonebot.plugins]
"nonebot-plugin-ncqrcode" = ["nonebot_plugin_ncqrcode"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nonebot_plugin_ncqrcode"
